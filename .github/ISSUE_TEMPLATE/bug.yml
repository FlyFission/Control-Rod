name: Bug
description: Something does not work as documented.
labels: ["kind: bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a way around a control (an agent approving its own work, evidence that can be altered, a signature that can be moved), do not file it here. Use the private security report link on the New issue page.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, the page you were on, and any package or run IDs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node version, and whether you used the embedded Postgres or your own.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or output
      render: shell
  - type: dropdown
    id: trust
    attributes:
      label: Does the fix likely touch a trust surface?
      description: policies/, tests/redteam/, .github/workflows/, spec/ major versions or kernel decision functions. These need a second maintainer.
      options:
        - No
        - Yes
        - Not sure
    validations:
      required: true
