name: readme-shots-commit

# Pushes the pictures from a finished readme-shots run to that pull request's own branch.
# workflow_run always runs this file as it is on the default branch, so a pull request cannot change
# what holds the write token. It runs no code from the branch: it checks the branch out, downloads
# the artifact outside the workspace, accepts only flat, small, real PNG files with plain names,
# copies them to docs/assets/readme/app/ and pushes that one commit.
#
# The artifact was made by pull request code, so it is untrusted, and the branch, commit and
# repository come from GitHub's event, not from the artifact. Only pull requests from this
# repository are served; a fork's pull request is refused. Any workflow named readme-shots can start
# this, including one a branch adds, so the checks below, not the name, are what hold.
#
# GitHub starts no workflow for a push made with this job's own token, so the commit pushed here
# gets no ci run and the pull request waits on its checks. Run ci by hand on the branch (Actions,
# ci, Run workflow) or close and reopen the pull request (docs/collaboration.md, Branch
# protection). A token that would start ci itself needs a GitHub App or a personal token, which
# is the owner's choice.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] see the header: the run is checked, and the artifact is untrusted
    workflows: [readme-shots]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: readme-shots-commit-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  commit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: write only to push the pictures to the pull request's own branch; actions: read to
      # download the artifact from the readme-shots run. No step here runs branch code.
      contents: write
      actions: read
    steps:
      # The stored credential is what the final push uses. This job uploads no artifact and runs no
      # branch code, so nothing can read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 1
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readme-shots
          path: ${{ runner.temp }}/readme-shots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check the pictures and commit them to the pull request's branch
        env:
          SHOTS: ${{ runner.temp }}/readme-shots
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "The branch moved past $HEAD_SHA after the screenshots were taken; the newer run commits the pictures."
            exit 0
          fi
          # A flat folder of at most 20 regular PNG files, each with a plain lower-case name, a PNG
          # signature and under 5 MB.
          if find "$SHOTS" -mindepth 1 ! -type f -print -quit | grep -q .; then
            echo "::error::The artifact holds something other than plain files."; exit 1
          fi
          count=0
          for f in "$SHOTS"/*; do
            name="$(basename "$f")"
            if ! printf '%s' "$name" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}\.png$'; then
              echo "::error::Refused file name in the artifact."; exit 1
            fi
            if [ "$(head -c 8 "$f" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
              echo "::error::$name is not a PNG file."; exit 1
            fi
            if [ "$(stat -c %s "$f")" -gt 5242880 ]; then
              echo "::error::$name is larger than 5 MB."; exit 1
            fi
            count=$((count + 1))
          done
          if [ "$count" -lt 1 ] || [ "$count" -gt 20 ]; then
            echo "::error::Expected 1 to 20 pictures, found $count."; exit 1
          fi
          mkdir -p docs/assets/readme/app
          rm -f docs/assets/readme/app/*.png
          cp -- "$SHOTS"/*.png docs/assets/readme/app/
          git add -- docs/assets/readme/app
          if git diff --cached --quiet; then echo "No change to the pictures."; exit 0; fi
          if git diff --cached --name-only | grep -v '^docs/assets/readme/app/[^/]*\.png$' | grep -q .; then
            echo "::error::The commit would touch files outside docs/assets/readme/app/."; exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -s -m "docs(readme): refresh app screenshots from the readme-shots workflow"
          git push origin "HEAD:refs/heads/$HEAD_REF"
