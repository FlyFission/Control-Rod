name: readme-shots

# Takes the README tour's app screenshots from a release build against recorded sample fixtures
# (apps/web/e2e/readme-shots.spec.ts). It runs on demand, or on a pull request when the spec or this
# workflow changes, in two jobs:
#
# - `shots` builds and runs the pull request's code with a read-only token and no stored git
#   credentials, and keeps the pictures as a 14-day artifact. No write token is ever present while
#   pull request code, its dependencies or their install scripts run.
# - `commit` runs only on a pull request from this repository. It runs no code from the branch: it
#   checks the branch out, downloads the artifact outside the workspace, accepts only flat, small,
#   real PNG files with plain names, copies them to docs/assets/readme/app/ and pushes that one
#   commit. It alone holds contents: write.
#
# A pull request from a fork gets a read-only token from GitHub and never reaches `commit`.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/web/e2e/readme-shots.spec.ts
      - .github/workflows/readme-shots.yml

permissions:
  contents: read

concurrency:
  group: readme-shots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Read only: this job runs the pull request's code and its dependencies.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @control-rod/spec run build
      - run: pnpm --filter @control-rod/web exec playwright install --with-deps chromium
      - name: Take the screenshots
        working-directory: apps/web
        env:
          THEME_TEST_RELEASE: "true"
          SHOTS_DIR: ${{ runner.temp }}/readme-shots
        run: pnpm exec playwright test e2e/readme-shots.spec.ts --project=chromium --reporter=list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-shots
          path: ${{ runner.temp }}/readme-shots
          if-no-files-found: error
          retention-days: 14

  commit:
    needs: shots
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only to push the pictures to this pull request's own branch. No step here runs branch code.
      contents: write
    steps:
      # The stored credential is what the final push uses. This job uploads no artifact and runs no
      # branch code, so nothing can read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readme-shots
          path: ${{ runner.temp }}/readme-shots
      - name: Check the pictures and commit them to the pull request's branch
        env:
          SHOTS: ${{ runner.temp }}/readme-shots
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "The branch moved past $HEAD_SHA after this run started; the newer run commits the pictures."
            exit 0
          fi
          # The artifact was made by pull request code, so treat it as untrusted: a flat folder of at
          # most 20 regular PNG files, each with a plain lower-case name, a PNG signature and under 5 MB.
          if find "$SHOTS" -mindepth 1 ! -type f -print -quit | grep -q .; then
            echo "::error::The artifact holds something other than plain files."; exit 1
          fi
          count=0
          for f in "$SHOTS"/*; do
            name="$(basename "$f")"
            if ! printf '%s' "$name" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}\.png$'; then
              echo "::error::Refused file name in the artifact."; exit 1
            fi
            if [ "$(head -c 8 "$f" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
              echo "::error::$name is not a PNG file."; exit 1
            fi
            if [ "$(stat -c %s "$f")" -gt 5242880 ]; then
              echo "::error::$name is larger than 5 MB."; exit 1
            fi
            count=$((count + 1))
          done
          if [ "$count" -lt 1 ] || [ "$count" -gt 20 ]; then
            echo "::error::Expected 1 to 20 pictures, found $count."; exit 1
          fi
          mkdir -p docs/assets/readme/app
          rm -f docs/assets/readme/app/*.png
          cp -- "$SHOTS"/*.png docs/assets/readme/app/
          git add -- docs/assets/readme/app
          if git diff --cached --quiet; then echo "No change to the pictures."; exit 0; fi
          if git diff --cached --name-only | grep -v '^docs/assets/readme/app/[^/]*\.png$' | grep -q .; then
            echo "::error::The commit would touch files outside docs/assets/readme/app/."; exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -s -m "docs(readme): refresh app screenshots from the readme-shots workflow"
          git push origin "HEAD:refs/heads/$HEAD_REF"
