[workspace]
resolver = "3"
members = ["kernel"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/FlyFission/control-rod"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
