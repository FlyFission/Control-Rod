<text x="658" y="113" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#00f2ff">3. BLIND CHECKER (VENDOR B)</text>
<text x="658" y="142" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#edf4fc">Codex (or Claude Code)</text>
