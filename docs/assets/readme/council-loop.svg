<text x="278" y="368" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#c8d6e5">Every transition is decided by deterministic Rust functions no agent can edit, bypass, or sign for.</text>
