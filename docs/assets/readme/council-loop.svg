<text x="902" y="142" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#edf4fc">Signed Provenance</text>
<text x="902" y="162" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#c8d6e5">• Binds exact SHA-256 diff</text>
