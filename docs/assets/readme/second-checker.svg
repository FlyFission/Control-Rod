<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
<title id="t">GPT-4 checking itself vs. an outside checker</title>
<desc id="d">Graph coloring: Answers alone 16%, GPT-4 checks itself 2%, Outside checker 38%; Game of 24: Answers alone 5%, GPT-4 checks itself 3%, Outside checker 36%. Source: https://arxiv.org/abs/2402.08115, Table 1.</desc>
<rect width="720" height="360" rx="12" fill="#0b1220"/>
<text x="64" y="32" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#f1f5f9">GPT-4 checking itself vs. an outside checker</text>
<text x="64" y="52" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#94a3b8">% of 100 problems solved. Stechly, Valmeekam and Kambhampati (2024), Table 1.</text>
