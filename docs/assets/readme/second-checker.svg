<text x="152.0" y="214.2" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">16%</text>
<rect x="194.0" y="281.3" width="56" height="8.7" rx="3" fill="#ef4444"/>
