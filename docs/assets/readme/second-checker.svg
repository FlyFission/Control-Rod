<text x="56" y="163.2" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">30%</text>
<line x1="64" x2="696" y1="115.6" y2="115.6" stroke="#1e293b"/>
<text x="56" y="119.6" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">40%</text>
<line x1="64" x2="696" y1="72.0" y2="72.0" stroke="#1e293b"/>
<text x="56" y="76.0" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">50%</text>
