<rect x="264.0" y="124.3" width="56" height="165.7" rx="3" fill="#06b6d4"/>
<text x="292.0" y="118.3" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">38%</text>
<text x="222.0" y="312" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#cbd5e1">Graph coloring</text>
