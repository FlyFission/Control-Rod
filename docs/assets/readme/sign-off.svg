<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">How a piece of work is finished in Control Rod</title>
  <desc id="d">Three steps. An agent such as Claude Code does the work in its sandbox and the system records the evidence. A different agent such as Codex checks the result and the evidence without seeing the author's reasoning. You read it and sign with your passkey. Nothing counts as done until you sign.</desc>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8f0f8; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #94a3b8; }
    .small { font-size: 13px; }
    .label { font-size: 12px; letter-spacing: .06em; }
    .title { font-size: 17px; font-weight: 600; }
  </style>
  <rect width="960" height="330" rx="14" fill="#0a0a0c"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57626f"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g transform="translate(24 28)">
    <rect width="272" height="230" rx="10" fill="#141416" stroke="#2f2f30"/>
    <text x="18" y="30" class="label mono muted">1  THE WORK</text>
    <text x="18" y="62" class="title">Fix the login redirect</text>
    <rect x="18" y="80" width="104" height="24" rx="12" fill="none" stroke="#6ea8ff"/>
    <text x="70" y="96" class="small" text-anchor="middle" style="fill:#6ea8ff">Claude Code</text>
    <text x="18" y="134" class="small muted">Works inside the sandbox</text>
    <text x="18" y="154" class="small muted">recorded for this run.</text>
    <text x="18" y="184" class="small muted">Test runs and diffs are saved</text>
    <text x="18" y="204" class="small muted">as evidence as they happen.</text>
  </g>
  <path d="M302 143 H330" stroke="#57626f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(344 28)">
    <rect width="272" height="230" rx="10" fill="#141416" stroke="#2f2f30"/>
    <text x="18" y="30" class="label mono muted">2  AN INDEPENDENT CHECK</text>
    <text x="18" y="62" class="title">Checked by a different agent</text>
    <rect x="18" y="80" width="72" height="24" rx="12" fill="none" stroke="#e58bd8"/>
    <text x="54" y="96" class="small" text-anchor="middle" style="fill:#e58bd8">Codex</text>
    <text x="18" y="134" class="small muted">Reads the result and the</text>
    <text x="18" y="154" class="small muted">evidence. The author's reasoning</text>
    <text x="18" y="174" class="small muted">stays out of its view.</text>
    <circle cx="25" cy="205" r="5" fill="#00ff9d"/>
    <text x="38" y="210" class="small">4 of 4 criteria met</text>
  </g>
  <path d="M622 143 H650" stroke="#57626f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(664 28)">
    <rect width="272" height="230" rx="10" fill="#141416" stroke="#ffaa00"/>
    <text x="18" y="30" class="label mono muted">3  YOUR SIGN-OFF</text>
    <text x="18" y="62" class="title">Waiting on you</text>
    <text x="18" y="94" class="small muted">You see exactly what was checked.</text>
    <text x="18" y="114" class="small muted">Your signature covers that, and</text>
    <text x="18" y="134" class="small muted">only that.</text>
    <rect x="18" y="160" width="112" height="34" rx="8" fill="#00f2ff"/>
    <text x="74" y="182" class="small" text-anchor="middle" style="fill:#001a1c;font-weight:600">Accept</text>
    <rect x="140" y="160" width="112" height="34" rx="8" fill="none" stroke="#2f2f30"/>
    <text x="196" y="182" class="small" text-anchor="middle">Send back</text>
    <text x="18" y="214" class="small muted">Signed with your passkey</text>
  </g>

  <text x="480" y="296" class="small" text-anchor="middle">Nothing counts as done until step 3.</text>
</svg>
