# County parcel services that `cr-site parcel resolve` can query by parcel ID.
#
# Empty on purpose. On 2026-10-22 none could be verified: the Greenville County GIS server
# (www.gcgis.org) returned "Could not access any server machines", and SC DNR's statewide
# table (SC_County_Parcel_Viewers) lists links to county viewers, not query endpoints.
#
# To add a county, confirm its ArcGIS REST parcel layer answers a query, then add an entry:
#
# counties:
#   "greenville county, sc":
#     name: "Greenville County GIS, tax parcels"
#     url: "https://<host>/arcgis/rest/services/<folder>/<service>/MapServer/<layer>/query"
#     id_field: "PIN"
#     verified: "2026-10-22, by <person>, query PIN='...' returned one polygon"
#
# Keys are "<county> county, <state>" in lower case.
counties: {}
