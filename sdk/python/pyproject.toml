[project]
name = "controlrod"
version = "0.0.0"
description = "Control Rod calc SDK: execution traces, units and results for engineering calculations."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlrod"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
